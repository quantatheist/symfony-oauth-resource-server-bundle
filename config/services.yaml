services:
    Quantatheist\OAuthResourceServer\Bootstrap\BootstrapDocumentValidator: ~

    # Safe default: installing the bundle without a mobile client configuration must
    # never break cache:clear. Host applications can explicitly override this alias.
    Quantatheist\OAuthResourceServer\Bootstrap\DisabledClientBootstrapProvider: ~

    Quantatheist\OAuthResourceServer\Bootstrap\ClientBootstrapProviderInterface:
        alias: Quantatheist\OAuthResourceServer\Bootstrap\DisabledClientBootstrapProvider

    Quantatheist\OAuthResourceServer\Controller\ClientBootstrapController:
        public: true
        arguments:
            $provider: '@Quantatheist\OAuthResourceServer\Bootstrap\ClientBootstrapProviderInterface'
            $validator: '@Quantatheist\OAuthResourceServer\Bootstrap\BootstrapDocumentValidator'

# Bootstrap stays disabled unless the host explicitly overrides the provider
# interface alias. No bundle route is imported automatically.
